# For deploying from the command line (npx wrangler deploy). The site lives at selvedge.garden and this worker at api.selvedge.garden.
name = "drift-garden-api"
main = "../garden-api.js"
compatibility_date = "2026-10-01"
routes = [{ pattern = "api.selvedge.garden", custom_domain = true }]

[vars]
RP_ID = "selvedge.garden"
ORIGINS = "https://selvedge.garden,https://www.selvedge.garden"

[[d1_databases]]
binding = "DB"
database_name = "drift-garden"
database_id = "e77a2fe6-6ae3-4c57-845c-0eda5a21ccc9"

[[kv_namespaces]]
binding = "GARDENS"
id = "c1f0c1e012e843faadc0f3f1f0400d55"
