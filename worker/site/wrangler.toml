# Deploy with: npx wrangler deploy (from this folder). Serves selvedge.garden from the GitHub Pages site.
name = "selvedge-site"
main = "site.js"
compatibility_date = "2026-10-01"
routes = [
  { pattern = "selvedge.garden", custom_domain = true },
  { pattern = "www.selvedge.garden", custom_domain = true },
]
