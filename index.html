<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Selvedge Garden: a place to drop the things that inspire you, wander them, and share an allotment with friends. Wildflowers sprout by clunky, hand-written rules: more art school library stacks than feed.">
<title>Selvedge Garden</title>
<script>
  // links shared to the old address (bookmarklet, share sheet) still land in your garden
  if (/[?&](url|plant|text|title)=/.test(location.search)) location.replace('garden/' + location.search);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#d8ff3c">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Martian+Mono:wdth,wght@75..112.5,100..600&display=swap">
<style>
:root { --sky: #d8ff3c; --field: #1d34d8; --wire: #8d9696; --i1: #1d34d8; --i2: #ff3b1f; --i3: #111; --bag: rgba(255,255,255,.55);
  --mark: "Major Mono Display", ui-monospace, monospace; --mono: "Martian Mono", ui-monospace, monospace; color-scheme: light; }
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--sky); color: #111; font: 300 11px/1.45 var(--mono); font-stretch: 87%; letter-spacing: .01em; overflow: hidden; }
a { color: inherit; }
:focus-visible { outline: 1.5px solid currentColor; outline-offset: 3px; }

/* sky, a low horizon, a field */
.land { position: fixed; inset: 0; perspective: 1100px; perspective-origin: 30% 55%; overflow: hidden; }
.land::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: var(--field); }
/* the fence runs off into the distance */
.fence { position: absolute; z-index: 2; left: -12%; width: 300%; bottom: 24%; height: 52%; transform: rotateY(32deg); transform-origin: 0 50%; transform-style: preserve-3d; }
.mesh { position: absolute; inset: 0; background:
  repeating-linear-gradient(60deg, var(--wire) 0 1.1px, transparent 1.1px 19px),
  repeating-linear-gradient(-60deg, var(--wire) 0 1.1px, transparent 1.1px 19px); opacity: .9; }
.rail { position: absolute; left: 0; right: 0; top: -3px; height: 5px; background: var(--wire); }
.post { position: absolute; top: -6px; bottom: -24px; width: 6px; background: var(--wire); }
/* what the wind leaves */
.snag { position: absolute; left: 0; top: 0; transform-origin: var(--ox, 0) var(--oy, 0); animation: flap var(--d, 3s) ease-in-out var(--dl, 0s) infinite alternate; filter: var(--age, none); }
@keyframes flap { from { transform: translate(var(--x), var(--y)) rotate(var(--r)) skewY(0deg); } to { transform: translate(var(--x), var(--y)) rotate(calc(var(--r) + var(--a))) skewY(var(--s)); } }
.snag > i { position: absolute; inset: 0; background: var(--bg, transparent); clip-path: var(--cut, none); }
.snag > i::after { content: ""; position: absolute; inset: var(--pad, 0); background: var(--c); -webkit-mask: var(--img) var(--mp) / var(--ms) no-repeat; mask: var(--img) var(--mp) / var(--ms) no-repeat; }
.snag.bagged > i { background: var(--bag); backdrop-filter: blur(1.5px); }
.snag.label { padding: 3px 6px 4px; background: #fff; white-space: nowrap; font: 400 10px/1.2 var(--mono); font-stretch: 75%; letter-spacing: .14em; text-transform: uppercase; }
/* blowing in */
.loose { position: fixed; z-index: 3; left: 0; top: 0; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .snag { animation: none; transform: translate(var(--x), var(--y)) rotate(var(--r)); } }

/* the few words */
.say { position: fixed; z-index: 10; left: clamp(16px, 4vw, 48px); top: clamp(16px, 4vh, 40px); display: grid; gap: 14px; justify-items: start; }
.mark { margin: 0; font: 400 clamp(26px, 3.4vw, 46px)/1 var(--mark); letter-spacing: -.02em; }
#goGarden { text-decoration: none; font: 500 12px/1 var(--mono); font-stretch: 112%; letter-spacing: .06em; border-bottom: 1.5px solid; padding-bottom: 3px; }
#acct { display: grid; gap: 6px; }
#acct form { display: flex; align-items: center; gap: 6px; margin: 0; }
#acct input { width: 200px; font: 300 12px/1.2 var(--mono); padding: 5px 0; border: 0; border-bottom: 1px solid; background: transparent; color: inherit; border-radius: 0; }
#acct input::placeholder { color: inherit; opacity: .55; }
#acct button { background: none; border: 0; padding: 4px 0; cursor: pointer; color: inherit; font: 500 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
#acct .swap { opacity: .6; text-decoration: underline; text-underline-offset: 3px; justify-self: start; }
#keyLine { font: 500 12px/1.4 var(--mono); }
#acctIn small { opacity: .7; }
#acctIn:not(.fresh) .fresh-only { display: none; }
.moving { position: fixed; z-index: 11; right: 16px; top: 16px; max-width: 220px; display: grid; gap: 6px; justify-items: start; }
.moving h2, .moving p { margin: 0; font: inherit; }
.moving button { background: none; border: 0; border-bottom: 1.5px solid; padding: 0 0 2px; color: inherit; font: 500 11px/1 var(--mono); cursor: pointer; }
/* public gardens hang on the fence like tags */
#public { position: absolute; left: 9%; bottom: 4%; width: 20%; display: block; transform: translateZ(1px); }
#gardens { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; }
.clip { background: #fff; color: #111; border: 0; padding: 5px 8px 6px; cursor: pointer; font: 400 10px/1.2 var(--mono); font-stretch: 75%; letter-spacing: .1em; text-transform: uppercase; transform: rotate(var(--t, -4deg)); transform-origin: 0 0; animation: tagflap 2.6s ease-in-out infinite alternate; }
.clip:nth-child(2n) { --t: 5deg; animation-duration: 3.4s; }
@keyframes tagflap { to { transform: rotate(calc(var(--t, -4deg) + 9deg)); } }
.clip b { font-weight: 500; } .clip small, .clip .pics, .clip ul { display: none; }
.credit { position: fixed; z-index: 10; right: 14px; bottom: 12px; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; opacity: .7; color: var(--sky); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111; color: #fff; padding: 8px 14px; font: 400 11px/1.4 var(--mono); max-width: calc(100% - 32px); z-index: 99; }
@media (max-width: 640px) {
  .fence { left: -30%; width: 360%; bottom: 26%; height: 44%; transform: rotateY(38deg); }
  #public { left: 16%; width: 18%; }
  .land { perspective-origin: 10% 55%; }
  #acct input { width: 170px; font-size: 16px; }
}
</style>
</head>
<body>

<div class="land" aria-hidden="false">
  <div class="fence" id="fence">
    <div class="mesh"></div><div class="rail"></div>
    <section id="public" hidden aria-label="Other people’s gardens"><div id="gardens"></div></section>
  </div>
</div>

<main class="say">
  <h1 class="mark">selvedge</h1>
  <a href="garden/" id="goGarden">start a garden →</a>
  <div id="acct" hidden>
    <div id="acctOut">
      <form id="keyForm"><input type="text" id="keyIn" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="four-word key" aria-label="Your garden key, four words"><button type="submit">in</button></form>
      <form id="signUp" hidden><input type="text" id="signUpName" maxlength="40" autocomplete="nickname" placeholder="a name" aria-label="Your name, as friends will see it"><button type="submit">make</button></form>
      <button type="button" class="swap" id="swap">new?</button>
    </div>
    <div id="acctIn" hidden>
      <span id="meName"></span>
      <span id="keyLine"></span>
      <small class="fresh-only">keep these four words</small>
      <button type="button" id="signOut" style="justify-self:start">out</button>
    </div>
  </div>
</main>

<section class="moving" id="moving" hidden>
  <h2>moved to selvedge.garden</h2>
  <button type="button" id="carry">carry it over</button>
  <p id="carryNote"></p>
</section>

<a class="credit" href="https://github.com/caitkne/drift-garden/blob/main/assets/zine/CREDITS.md">pictures: public domain</a>
<script>
// A fence on a windy field. Whatever blows in snags on the wire; the old stuff bleaches and blows away.
(() => {
  const R = Math.random, pick = a => a[Math.floor(R() * a.length)], btw = (a, b) => a + R() * (b - a);
  const SCHEMES = [
    { sky: '#d8ff3c', field: '#1d34d8', wire: '#7c8585', inks: ['#1d34d8', '#ff3b1f', '#111'], ui: '#111' },
    { sky: '#c9b8ff', field: '#5b0a1a', wire: '#8a8592', inks: ['#5b0a1a', '#ff2e7a', '#1a1a1a'], ui: '#2a0710' },
    { sky: '#b9f3d8', field: '#ff2a1a', wire: '#7d8a86', inks: ['#ff2a1a', '#0e3b2e', '#111'], ui: '#0e3b2e' },
    { sky: '#ff6a13', field: '#141110', wire: '#3b3533', inks: ['#141110', '#f4f0e8', '#2b44ff'], ui: '#141110' },
    { sky: '#e8eae6', field: '#002fa7', wire: '#9ea3a0', inks: ['#002fa7', '#ff4f00', '#111'], ui: '#002fa7' },
  ];
  const S = pick(SCHEMES), root = document.documentElement.style;
  root.setProperty('--sky', S.sky); root.setProperty('--field', S.field); root.setProperty('--wire', S.wire); document.body.style.color = S.ui;
  const PICS = [['astronaut',1.00],['cat-eyes',3.16],['coffee',1.12],['crowd',1.79],['dancers',1.76],['deep-field',1.15],['eye-macro',1.43],['haircut',0.76],['heavens',1.17],['hippies',1.24],['hopper',0.74],['horse',1.22],['lac',0.64],['lash-strip',2.65],['lashes',0.63],['marnac',0.44],['model',0.36],['porthole',1.00],['portrait',0.85],['profile',1.06],['providence',0.97],['radiant',1.47],['retina',1.00],['rings',1.41],['wig',1.00],['gen-2',1],['gen-5',1],['gen-8',1]];
  const LABELS = ['sow', 'later', 'come back', 'perennial', 'wildflower', 'cutting', 'allotment', 'no. ' + Math.floor(btw(1, 9999)), 'keep', 'net wt. —', 'do not compost', 'lot 4', 'spores', 'moth', 'seed', 'sell by: never'];
  const fence = document.getElementById('fence');
  const torn = () => { const p = [], n = 5 + Math.floor(R() * 6), j = () => btw(0, 9).toFixed(1);
    for (let i = 0; i < n; i++) p.push(`${(i / n * 100).toFixed(0)}% ${j()}%`);
    for (let i = 0; i < n; i++) p.push(`${100 - j()}% ${(i / n * 100).toFixed(0)}%`);
    for (let i = 0; i < n; i++) p.push(`${(100 - i / n * 100).toFixed(0)}% ${100 - j()}%`);
    for (let i = 0; i < n; i++) p.push(`${j()}% ${(100 - i / n * 100).toFixed(0)}%`);
    return `polygon(${p.join(',')})`; };
  // posts
  for (let x = 1; x < 100; x += 6) { const p = document.createElement('div'); p.className = 'post'; p.style.left = x + '%'; fence.appendChild(p); }
  const snags = [];
  function make(gen) {
    const W = fence.clientWidth, H = fence.clientHeight, el = document.createElement('div'), kind = R();
    let w, h;
    if (kind < .12) { el.className = 'snag label'; el.textContent = pick(LABELS); w = 80; h = 18; }
    else {
      const [img, ar] = pick(PICS), crop = R() < .5 ? 1 : btw(1.3, 3.5);
      w = (R() < .08 ? btw(.05, .09) : btw(.012, .04)) * W; h = w / (crop > 1 ? btw(.5, 1.8) : ar);
      const bag = R() < .3, bg = bag ? '' : pick(['#fff', '#fff', 'transparent', S.sky, '#f2efe8']);
      el.className = 'snag' + (bag ? ' bagged' : '');
      el.style.cssText = `width:${w.toFixed(0)}px;height:${h.toFixed(0)}px;--img:url(assets/zine/z-${img}.png);--c:${pick(S.inks)};${bag ? '' : '--bg:' + bg + ';'}--pad:${bg === 'transparent' ? 0 : btw(2, 6).toFixed(0)}px;--cut:${torn()};--ms:${crop > 1 ? (crop * 100).toFixed(0) + '% auto' : 'cover'};--mp:${btw(0, 100).toFixed(0)}% ${btw(0, 100).toFixed(0)}%`;
      el.innerHTML = '<i></i>';
    }
    // most things end up low on the wire, pushed by the wind
    const y = H * (1 - Math.pow(R(), 2.4)) - h * .6, x = btw(W * .05, W * .42);
    const st = el.style; st.setProperty('--x', x.toFixed(0) + 'px'); st.setProperty('--y', y.toFixed(0) + 'px'); st.setProperty('--r', btw(-30, 30).toFixed(0) + 'deg');
    st.setProperty('--a', btw(4, 16).toFixed(0) + 'deg'); st.setProperty('--s', btw(-10, 10).toFixed(0) + 'deg'); st.setProperty('--d', btw(.5, 2.4).toFixed(2) + 's'); st.setProperty('--dl', (-btw(0, 2)).toFixed(2) + 's');
    st.setProperty('--ox', btw(0, 30).toFixed(0) + '%'); st.setProperty('--oy', btw(0, 20).toFixed(0) + '%');
    el.gen = gen; age(el, gen); fence.appendChild(el); snags.push(el); return el;
  }
  // older generations bleach, go see-through and get tatty
  const age = (el, g) => { el.style.setProperty('--age', g <= 0 ? 'none' : `saturate(${Math.max(0, 1 - g * .28).toFixed(2)}) contrast(${Math.max(.45, 1 - g * .12).toFixed(2)}) opacity(${Math.max(.25, 1 - g * .17).toFixed(2)})`); };
  const n = innerWidth < 640 ? 46 : 90;
  for (let k = 0; k < n; k++) make(Math.floor(R() * 5));
  // the wind: every few seconds something blows in and snags; the oldest lets go
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) setInterval(() => {
    if (document.hidden) return;
    snags.forEach(el => { if (R() < .08) { el.gen++; age(el, el.gen); } });
    const old = snags.filter(el => el.gen >= 5); if (old.length) { const o = pick(old); o.style.transition = 'opacity 1.2s'; o.style.opacity = 0; setTimeout(() => o.remove(), 1300); snags.splice(snags.indexOf(o), 1); }
    const el = make(0); el.animate([{ opacity: 0, translate: '-60vw -20vh', rotate: '-200deg' }, { opacity: 1, translate: '0 0', rotate: '0deg' }], { duration: btw(1400, 2600), easing: 'cubic-bezier(.2,.7,.3,1)' });
  }, 2200);
  // a gust when you tap the sky
  document.querySelector('.land').addEventListener('click', e => { if (e.target.closest('.clip')) return; snags.forEach(el => el.animate([{ translate: '0 0' }, { translate: `${btw(6, 26).toFixed(0)}px ${btw(-8, 4).toFixed(0)}px` }, { translate: '0 0' }], { duration: btw(500, 1100), easing: 'ease-out' })); });
  document.getElementById('swap').addEventListener('click', () => { const k = document.getElementById('keyForm'), u = document.getElementById('signUp'), b = document.getElementById('swap'); const toNew = !k.hidden; k.hidden = toNew; u.hidden = !toNew; b.textContent = toNew ? 'have a key?' : 'new?'; (toNew ? document.getElementById('signUpName') : document.getElementById('keyIn')).focus(); });
})();
</script>
<script>
(() => {
  const API = 'https://api.selvedge.garden';
  const OLD = 'https://caitkne.github.io', NEW = 'https://selvedge.garden';
  const HOME = /^(www\.)?selvedge\.garden$/.test(location.hostname);
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const toast = m => { const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); };
  const jget = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
  const jset = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  // your own print run colours, if you have one
  const name = (() => { try { return (localStorage.getItem('drift-garden-name') || '').trim(); } catch (e) { return ''; } })();
  const mine = jget('drift-garden') || [];
  $('goGarden').textContent = mine.length ? 'your garden →' : 'start a garden →';
  (() => { const c = document.createElement('canvas'); c.width = c.height = 200; const g = c.getContext('2d'), d = g.createImageData(200, 200);
    for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 16; }
    g.putImageData(d, 0, 0); document.body.style.setProperty('--grain', `url(${c.toDataURL()})`); })();

  // ---------- moving house ----------
  const SKIP = new Set(['drift-garden-account', 'drift-garden-cloud']);
  const ours = k => /^(drift-garden|wander-)/.test(k) && !SKIP.has(k);
  if (location.origin === OLD) {
    $('moving').hidden = false;
    $('goGarden').textContent = 'stay here →';
    $('carry').addEventListener('click', () => {
      const keys = {}; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (ours(k)) keys[k] = localStorage.getItem(k); }
      const w = window.open(NEW + '/?arrive=1', '_blank');
      if (!w) { location.href = NEW + '/'; return; }
      $('carryNote').textContent = 'Carrying…';
      addEventListener('message', function on(ev) {
        if (ev.origin !== NEW || ev.source !== w || !ev.data) return;
        if (ev.data.type === 'ready') w.postMessage({ type: 'garden', keys }, NEW);
        if (ev.data.type === 'arrived') { removeEventListener('message', on); $('carryNote').textContent = 'Carried over. Your garden is waiting at selvedge.garden.'; }
      });
    });
  }
  if (HOME && /[?&]arrive=1/.test(location.search) && window.opener) {
    addEventListener('message', ev => {
      if (ev.origin !== OLD || !ev.data || ev.data.type !== 'garden' || typeof ev.data.keys !== 'object') return;
      if (mine.length && !confirm('There’s already a garden at this address. Replace it with the one you’re carrying over?')) return;
      for (let i = localStorage.length - 1; i >= 0; i--) { const k = localStorage.key(i); if (ours(k)) localStorage.removeItem(k); }
      Object.entries(ev.data.keys).forEach(([k, v]) => { if (ours(k) && typeof v === 'string') localStorage.setItem(k, v); });
      try { window.opener.postMessage({ type: 'arrived' }, OLD); } catch (e) {}
      location.replace('garden/');
    });
    window.opener.postMessage({ type: 'ready' }, OLD);
  }
  if (!HOME) return;

  // ---------- account: a garden key, four words ----------
  let account = jget('drift-garden-account');
  async function api(path, opt = {}) {
    const r = await fetch(API + path, { method: opt.method || 'GET', headers: { ...(account ? { Authorization: 'Bearer ' + account.token } : {}), ...(opt.body !== undefined ? { 'Content-Type': 'application/json' } : {}) }, body: opt.body === undefined ? undefined : JSON.stringify(opt.body) });
    let d = {}; try { d = await r.json(); } catch (e) {}
    if (r.status === 401 && account) { account = null; jset('drift-garden-account', null); showAcct(); }
    if (!r.ok) throw new Error(d.error || 'The garden server didn’t answer');
    return d;
  }
  const signedIn = (d, key) => { account = { token: d.token, id: d.user.id, name: d.user.name, key }; jset('drift-garden-account', account); showAcct(); };
  function showAcct() {
    $('acct').hidden = false; $('acctOut').hidden = !!account; $('acctIn').hidden = !account;
    if (account) { $('meName').textContent = account.name; $('keyLine').textContent = account.key || ''; }
  }
  $('keyForm').addEventListener('submit', async e => { e.preventDefault(); const k = $('keyIn').value.toLowerCase().replace(/[^a-z]+/g, ' ').trim(); if (!k) { $('keyIn').focus(); return; }
    try { signedIn(await api('/auth/key', { method: 'POST', body: { key: k } }), k); toast('Welcome back, ' + account.name); } catch (err) { toast(err.message); } });
  $('signUp').addEventListener('submit', async e => { e.preventDefault(); const n = $('signUpName').value.trim(); if (!n) { $('signUpName').focus(); return; }
    try { const d = await api('/auth/key/new', { method: 'POST', body: { name: n } }); signedIn(d, d.key); $('acctIn').classList.add('fresh'); } catch (err) { toast(err.message); } });
  $('signOut').addEventListener('click', async () => { try { await api('/auth/logout', { method: 'POST', body: {} }); } catch (e) {} account = null; jset('drift-garden-account', null); showAcct(); toast('Signed out'); });
  showAcct();

  // ---------- public gardens ----------
  const ago = t => { const d = Math.round((Date.now() - t) / 86400000); return d < 1 ? 'today' : d < 2 ? 'yesterday' : d < 30 ? d + ' days ago' : new Date(t).toLocaleDateString(); };
  (async () => {
    let list; try { list = (await api('/public')).gardens; } catch (e) { return; }
    $('public').hidden = false;
    const tilt = () => 0;
    $('gardens').innerHTML = list.length ? list.map((g, i) => `<button class="clip" type="button" style="--r:${tilt(i)}deg" data-id="${esc(g.id)}">
      ${g.pics && g.pics.length ? `<span class="pics">${g.pics.slice(0, 4).map(p => `<span><img alt="" loading="lazy" src="${esc(p)}"></span>`).join('')}</span>` : ''}
      <b>${esc(g.name)}</b><small>${esc(g.owner)} \u00b7 ${g.count}</small>
      ${g.titles && g.titles.length ? `<ul>${g.titles.slice(0, 4).map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}</button>`).join('')
      : '';
  })();
  $('gardens').addEventListener('click', async e => {
    const b = e.target.closest('.clip'); if (!b) return;
    try {
      const g = await api('/gardens/' + encodeURIComponent(b.dataset.id)), keys = {};
      ['drift-garden-run', 'drift-garden-display', 'drift-garden-studio'].forEach(k => { const v = localStorage.getItem(k); if (v != null) keys[k] = v; });
      // a public garden keeps its own colours and name
      const theirs = g.data && g.data.keys || {};
      ['drift-garden-run', 'drift-garden-display'].forEach(k => { if (theirs[k]) keys[k] = theirs[k]; });
      keys['drift-garden-name'] = g.name;
      sessionStorage.setItem('drift-visit', JSON.stringify({ id: g.id, name: g.name, public: true, keys, plots: [{ id: g.id, name: g.name, owner: g.owner, mine: g.mine, plants: theirs['drift-garden'] || '[]' }] }));
      location.href = 'garden/?visit=' + encodeURIComponent(g.id);
    } catch (err) { toast(err.message || 'Couldn’t open that garden'); }
  });
})();
</script>
</body>
</html>
